<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            .const-box { stroke: rgba(255, 255, 255, 0.2); stroke-width: 0.1; fill: none; }
            .const-circle-main { stroke: rgba(0, 255, 204, 0.6); stroke-width: 0.15; fill: none; }
            .const-circle-sub { stroke: rgba(255, 0, 128, 0.5); stroke-width: 0.1; fill: none; stroke-dasharray: 0.5 0.5; }
            .const-axis { stroke: rgba(255, 255, 255, 0.25); stroke-width: 0.1; }
            .const-golden { stroke: rgba(255, 165, 0, 0.5); stroke-width: 0.1; stroke-dasharray: 0.2 0.2; }
        </style>
    </defs>

    <!-- 1. Rule of Thirds (삼등분 법칙) 가이드라인 -->
    <!-- 18x18 캔버스를 가로세로 3등분 하는 선 (X=9, 15 / Y=9, 15) -->
    <line x1="9" y1="0" x2="9" y2="24" class="const-golden" />
    <line x1="15" y1="0" x2="15" y2="24" class="const-golden" />
    <line x1="0" y1="9" x2="24" y2="9" class="const-golden" />
    <line x1="0" y1="15" x2="24" y2="15" class="const-golden" />

    <!-- 2. 바우하우스 원형 그리드 (Concentric Circles) -->
    <!-- 메인 외곽 원 (반지름 9 - 18x18 박스에 외접) -->
    <circle cx="12" cy="12" r="9" class="const-circle-main" />
    <!-- 중앙을 감싸는 서브 원 (반지름 3) -->
    <circle cx="12" cy="12" r="3" class="const-circle-sub" />
    <!-- 대각선 꺾임을 결정하는 궤도 원 (반지름 4.242) -->
    <circle cx="12" cy="12" r="4.242" class="const-circle-sub" /> 

    <!-- 3. 메인 중심축 & 무한 대각선 (Infinite Diagonals) -->
    <line x1="12" y1="-5" x2="12" y2="29" class="const-axis" />
    <line x1="-5" y1="12" x2="29" y2="12" class="const-axis" />
    <line x1="-5" y1="-5" x2="29" y2="29" class="const-axis" />
    <line x1="29" y1="-5" x2="-5" y2="29" class="const-axis" />

    <!-- 4. 18x18 절대 경계 박스 (Square Keyline) -->
    <rect x="3" y="3" width="18" height="18" class="const-box"/>
</svg>