<svg width="100%" height="100%" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="background:#020a0d;">
        <defs><style>.sz-box { stroke: rgba(255, 165, 0, 0.8); stroke-width: 0.1; fill: none; }
        .sz-x { stroke: rgba(255, 165, 0, 0.4); stroke-width: 0.1; }</style></defs>
        <!-- Logo Safe Area -->
        <rect x="6" y="6" width="12" height="12" class="sz-box" fill="rgba(25, 145, 185, 0.2)" />
        <text x="12" y="12.5" fill="white" font-size="2" text-anchor="middle" font-family="sans-serif">LOGO AREA</text>
        
        <!-- Clear Space Padding (e.g. 1X padding around) -->
        <rect x="2" y="2" width="20" height="20" class="sz-box" stroke-dasharray="0.5 0.5" />
        
        <!-- X marks representing the metric unit for padding -->
        <line x1="2" y1="2" x2="6" y2="6" class="sz-x"/><line x1="6" y1="2" x2="2" y2="6" class="sz-x"/>
        <line x1="18" y1="2" x2="22" y2="6" class="sz-x"/><line x1="22" y1="2" x2="18" y2="6" class="sz-x"/>
        <line x1="2" y1="18" x2="6" y2="22" class="sz-x"/><line x1="6" y1="18" x2="2" y2="22" class="sz-x"/>
        <line x1="18" y1="18" x2="22" y2="22" class="sz-x"/><line x1="22" y1="18" x2="18" y2="22" class="sz-x"/>
        <text x="4" y="4.5" fill="rgba(255,165,0,0.8)" font-size="1.5" text-anchor="middle" font-family="monospace">X</text>
    </svg>