<svg width="100%" height="100%" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="background:#020a0d;">
        <defs><style>.t-line { stroke: rgba(0, 255, 204, 0.4); stroke-width: 0.1; fill: none; stroke-dasharray: 0.5 0.5;}
        .t-text { fill: rgba(0, 255, 204, 0.6); font-family: sans-serif; font-size: 1.5px; }</style></defs>
        <!-- Ascender Line --> <line x1="0" y1="4" x2="24" y2="4" class="t-line" /> <text x="1" y="3.5" class="t-text">Ascender (상단)</text>
        <!-- Cap Height --> <line x1="0" y1="6" x2="24" y2="6" class="t-line" style="stroke:rgba(255,255,255,0.6);" /> <text x="1" y="5.5" class="t-text" style="fill:white;">Cap Height (대문자)</text>
        <!-- X-Height --> <line x1="0" y1="12" x2="24" y2="12" class="t-line" style="stroke:rgba(255,0,128,0.6);"/> <text x="1" y="11.5" class="t-text" style="fill:#ff0080;">X-Height (소문자 기준선)</text>
        <!-- Baseline --> <line x1="0" y1="18" x2="24" y2="18" class="t-line" style="stroke:rgba(255,255,255,0.8); stroke-dasharray: none;"/> <text x="1" y="17.5" class="t-text" style="fill:white;">Baseline (바닥선)</text>
        <!-- Descender --> <line x1="0" y1="22" x2="24" y2="22" class="t-line" /> <text x="1" y="21.5" class="t-text">Descender (하단)</text>
        
        <!-- Optical Overshoot Guide (오버슈트 보정 영역) -->
        <rect x="0" y="18" width="24" height="0.5" fill="rgba(255,0,128,0.2)" />
        <rect x="0" y="5.5" width="24" height="0.5" fill="rgba(255,255,255,0.2)" />
    </svg>